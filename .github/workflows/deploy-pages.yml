name: Deploy Jasmine Order to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'clients/**'
      - 'client-requests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize every production Pages deployment so the normal site and the
# Multi-Client publisher can never replace each other's artifact.
concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
