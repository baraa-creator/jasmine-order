name: Test Jasmine Client Publisher

on:
  push:
    branches:
      - main
      - fix/multi-client-pages-catalog
  pull_request:

permissions:
  contents: read

jobs:
  test-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify master catalog
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          m=re.search(r"const DATA=(.*?);const ORIGINAL_DATA=",html,re.S)
          if not m: raise SystemExit("Master DATA marker is missing")
          names=[str(b.get("name","")).strip() for b in json.loads(m.group(1)).get("brands",[])]
          expected=["JASMINE","LUVEAL","CAVAYELO","MAROTA","Pure Passion","Jasmine Niche","Vilara"]
          if names!=expected: raise SystemExit(f"Unexpected master brands: {names}")
          print("Master catalog test passed:",names)
          PY

      - name: Publish test client
        run: python tools/publish_client.py client-requests/client-test-001.json

      - name: Publish selection v2 test client
        run: python tools/publish_client.py client-requests/client-selection-v2-test.json

      - name: Verify generated client
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          canonical = Path("clients/client-test-001.html")
          legacy = Path("clients/client-test-001/index.html")
          if not canonical.exists():
              raise SystemExit("Canonical generated client file was not created")
          if not legacy.exists():
              raise SystemExit("Legacy generated client file was not created")

          path = canonical
          html = path.read_text(encoding="utf-8")
          match = re.search(r"const DATA=(.*?);const ORIGINAL_DATA=", html, re.S)
          if not match:
              raise SystemExit("Generated client DATA marker is missing")

          data = json.loads(match.group(1))
          names = [str(b.get("name", "")).strip() for b in data.get("brands", [])]

          if names != ["JASMINE"]:
              raise SystemExit(f"Unexpected generated brands: {names}")

          if 'class="admin-launch"' in html:
              raise SystemExit("Admin launch button leaked into client")

          if "window.openAdmin=()=>{};" not in html:
              raise SystemExit("Static admin override is missing")

          print("Publisher integration test passed:", path)
          print("Legacy client path also present:", legacy)
          print("Canonical client URL path: /clients/client-test-001.html")
          print("Published brands:", names)

      - name: Verify selection v2 client
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          html=Path("clients/client-selection-v2-test.html").read_text(encoding="utf-8")
          m=re.search(r"const DATA=(.*?);const ORIGINAL_DATA=",html,re.S)
          if not m: raise SystemExit("V2 generated DATA marker is missing")
          data=json.loads(m.group(1))
          brands=data.get("brands",[])
          if [b.get("name") for b in brands] != ["Vilara"]:
              raise SystemExit("V2 brand filter failed")
          products=brands[0].get("products",[])
          if len(products)!=2: raise SystemExit(f"Expected 2 products, got {len(products)}")
          room=next(p for p in products if p.get("name")=="Room Spray")
          if room["sizes"][0]["fragrances"] != ["Strawberry","Spring"]:
              raise SystemExit("V2 fragrance selection failed for Room Spray")
          reed=next(p for p in products if p.get("name")=="Reed Diffuser")
          if reed["sizes"][0]["fragrances"] != ["Tulip"]:
              raise SystemExit("V2 fragrance selection failed for Reed Diffuser")
          print("Selection V2 integration test passed")
          PY
