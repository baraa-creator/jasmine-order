name: Publish Jasmine Client

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "Client ID"
        required: true
        type: string
      client_name:
        description: "Client name"
        required: true
        type: string
      brands_json:
        description: "JSON array of brand names"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: jasmine-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[JASMINE CLIENT]'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CLIENT_ID: ${{ inputs.client_id }}
          INPUT_CLIENT_NAME: ${{ inputs.client_name }}
          INPUT_BRANDS_JSON: ${{ inputs.brands_json }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python tools/make_client_request.py "$INPUT_CLIENT_ID" "$INPUT_CLIENT_NAME" "$INPUT_BRANDS_JSON"
            echo "request_file=client-requests/$INPUT_CLIENT_ID.json" >> "$GITHUB_OUTPUT"
          else
            REQUEST_FILE=$(python tools/make_issue_request.py "$ISSUE_BODY")
            echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build client page
        run: |
          REQUEST_FILE="${{ steps.request.outputs.request_file }}"
          test -f "$REQUEST_FILE"
          python tools/publish_client.py "$REQUEST_FILE"
          CLIENT_ID=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$REQUEST_FILE")
          test -f "clients/$CLIENT_ID/index.html"
          echo "Published clients/$CLIENT_ID/index.html"

      - name: Validate master catalog
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r"const DATA=(.*?);const ORIGINAL_DATA=", html, re.S)
          if not m:
              raise SystemExit("Master DATA marker is missing")
          data = json.loads(m.group(1))
          names = [str(b.get("name","")).strip() for b in data.get("brands",[])]
          required = ["JASMINE","LUVEAL","CAVAYELO","MAROTA","Pure Passion","Jasmine Niche","Vilara"]
          if names != required:
              raise SystemExit(f"Master catalog mismatch: {names}")
          print("Master catalog OK:", names)
          PY

      - name: Commit published client
        run: |
          git config user.name "Jasmine Client Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients client-requests
          git diff --cached --quiet || git commit -m "Publish Jasmine client"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
