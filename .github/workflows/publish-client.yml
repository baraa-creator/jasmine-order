name: Publish Jasmine Client

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "Client ID"
        required: true
        type: string
      client_name:
        description: "Client name"
        required: true
        type: string
      brands_json:
        description: "JSON array of brand names"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# Only one client publication may run at a time. This prevents two client
# requests from publishing competing Pages artifacts at the same time.
concurrency:
  group: jasmine-client-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[JASMINE CLIENT]'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CLIENT_ID: ${{ inputs.client_id }}
          INPUT_CLIENT_NAME: ${{ inputs.client_name }}
          INPUT_BRANDS_JSON: ${{ inputs.brands_json }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python tools/make_client_request.py "$INPUT_CLIENT_ID" "$INPUT_CLIENT_NAME" "$INPUT_BRANDS_JSON"
            echo "request_file=client-requests/$INPUT_CLIENT_ID.json" >> "$GITHUB_OUTPUT"
          else
            REQUEST_FILE=$(python tools/make_issue_request.py "$ISSUE_BODY")
            echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build client page
        id: build_client
        shell: bash
        run: |
          REQUEST_FILE="${{ steps.request.outputs.request_file }}"
          test -f "$REQUEST_FILE"

          python tools/publish_client.py "$REQUEST_FILE"

          CLIENT_ID=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$REQUEST_FILE")
          test -f "clients/$CLIENT_ID.html"
          test -f "clients/$CLIENT_ID/index.html"

          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "Published clients/$CLIENT_ID.html"
          echo "Published clients/$CLIENT_ID/index.html"

      - name: Validate master catalog
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r"const DATA=(.*?);const ORIGINAL_DATA=", html, re.S)
          if not m:
              raise SystemExit("Master DATA marker is missing")
          data = json.loads(m.group(1))
          names = [str(b.get("name","")).strip() for b in data.get("brands",[])]
          required = ["JASMINE","LUVEAL","CAVAYELO","MAROTA","Pure Passion","Jasmine Niche","Vilara"]
          if names != required:
              raise SystemExit(f"Master catalog mismatch: {names}")
          print("Master catalog OK:", names)
          PY

      - name: Commit published client
        run: |
          git config user.name "Jasmine Client Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients client-requests
          git diff --cached --quiet || git commit -m "Publish Jasmine client"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published client URL
        id: verify
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CLIENT_ID: ${{ steps.build_client.outputs.client_id }}
        run: |
          CLIENT_URL="${PAGE_URL%/}/clients/${CLIENT_ID}.html"
          echo "Checking: $CLIENT_URL"

          for attempt in $(seq 1 30); do
            STATUS=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "$CLIENT_URL" || true)
            echo "Attempt $attempt/30 -> HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "client_url=$CLIENT_URL" >> "$GITHUB_OUTPUT"
              echo "Client page is live: $CLIENT_URL"
              exit 0
            fi

            sleep 10
          done

          echo "Client page was deployed but did not become reachable within the verification window."
          exit 1

      - name: Report final client URL on issue
        if: github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CLIENT_URL: ${{ steps.verify.outputs.client_url }}
        run: |
          BODY=$(printf '## ✅ نسخة العميل جاهزة\\n\\nتم إنشاء نسخة العميل ونشرها والتحقق من أن الرابط يعيد **HTTP 200**.\\n\\n**الرابط النهائي:**\\n%s\\n\\nيمكن استخدام هذا الرابط مباشرة مع العميل.' "$CLIENT_URL")
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "$BODY"
